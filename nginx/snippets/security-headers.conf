# Baseline security headers. Include in HTTPS server blocks.
# HSTS applies to this host only. Add "; includeSubDomains" (and later
# "; preload") only once EVERY subdomain of the domain is served over HTTPS,
# otherwise browsers will refuse the plain-HTTP ones.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
