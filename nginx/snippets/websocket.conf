# WebSocket upgrade support. OPT-IN: include only in the location of sites
# that need it (add-site.sh <sub> <upstream> --ws). Relies on the
# $connection_upgrade map defined in nginx.conf.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
