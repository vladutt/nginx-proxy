# Per-client rate and connection limits, using the zones from nginx.conf
# (req_per_ip: 30 req/s, conn_per_ip). Included by the site template.
# Tune: change `rate` in nginx.conf for all sites, or burst / connection count
# here. Disable for one site: delete the include line from its file.
limit_req  zone=req_per_ip burst=100 nodelay;
limit_conn conn_per_ip 100;
limit_req_status  429;
limit_conn_status 429;
