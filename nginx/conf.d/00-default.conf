# Catch-all: unknown Host headers get no response (444) and unknown SNI
# names are rejected during the TLS handshake (no certificate needed).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
