# EXAMPLE ONLY -- not loaded by nginx (it lives outside nginx/conf.d).
#
# This is what `scripts/add-site.sh app app:3000` generates for
# app.<DOMAIN> -> container "app" on port 3000 (attached to the `proxy`
# network). "example.com" below stands for your DOMAIN from .env.
# Do not copy this file by hand; run the script so the hostname comes from .env.
#
# Variant: service running on the host instead of in a container
#   scripts/add-site.sh app host.docker.internal:3001
# replaces the three upstream lines in `location /` with:
#
#   proxy_pass http://host.docker.internal:3001;
#
# Variant: WebSocket app (adds one include after proxy-headers.conf)
#   scripts/add-site.sh app app:3000 --ws
#   include /etc/nginx/snippets/websocket.conf;

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    include /etc/nginx/snippets/ssl-cert.conf;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/rate-limit.conf;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_target "app:3000";
        proxy_pass http://$upstream_target;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
