# Rotate container logs: at most 5 files of 10 MB per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.28-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    # Reaching services running on the host (not in a container):
    # use host.docker.internal:<port> as the upstream.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Certificate reload hook: certbot cannot signal this container, so a
    # watcher checks the wildcard certificate every minute and reloads nginx
    # as soon as certbot has replaced it. Then nginx runs in the foreground.
    command: >-
      /bin/sh -c 'last="";
      while :; do
      now=$$(cksum /etc/letsencrypt/live/wildcard/fullchain.pem 2>/dev/null);
      if [ -n "$$last" ] && [ "$$now" != "$$last" ]; then nginx -s reload; fi;
      last="$$now"; sleep 60; done &
      exec nginx -g "daemon off;"'
    networks:
      - proxy

  certbot:
    image: certbot/dns-cloudflare:v3.1.0
    container_name: nginx-proxy-certbot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./secrets:/run/secrets:ro
    # Renewal loop: twice a day certbot renews the certificate if it is close
    # to expiry (DNS-01 credentials are remembered from the issuance).
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do
      certbot renew --quiet;
      sleep 12h & wait $${!}; done'

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
